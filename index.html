<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchmarking de Fretes Outbound | TMT</title>
<style>
:root{
  color-scheme:dark;
  --ground:#0B0C0F;--surface:#111318;--stone:rgba(255,255,255,.09);--stone-2:rgba(255,255,255,.18);
  --ink:#EDEFF2;--ink-2:#B7BEC6;--ink-3:#8A919A;
  --accent:#F4F5F6;--blue:#2E8BEF;--blue-2:#105CB0;--blue-3:#0A3A70;
  --serie-cliente:#2E8BEF;--serie-ref:#ECEEF0;
  --st-crit:#F07A72;--st-warn:#E8B04A;--st-neut:#B4BAC2;--st-comp:#5BD093;--st-info:#7DBBFA;
  --card:linear-gradient(180deg,#15181E 0%,#111318 100%);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 6px 18px rgba(0,0,0,.18);
  --font:Arial,Helvetica,'Liberation Sans',sans-serif;--gutter:clamp(16px,3.2vw,56px);
}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;overflow-x:clip}
h1,h2,h3{margin:0;text-wrap:balance;color:var(--ink);letter-spacing:0}
h1{font-size:clamp(20px,1.75vw,26px);line-height:1.22;font-weight:700}
h2{font-size:clamp(15px,1.1vw,16.5px);line-height:1.3;font-weight:700}
p{margin:0} button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin-inline:auto;padding-left:var(--gutter);padding-right:var(--gutter)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- topo ---------- */
.top{position:relative;background:radial-gradient(900px 260px at 78% -40%,rgba(46,139,239,.16),transparent 65%),radial-gradient(700px 240px at 8% 130%,rgba(16,92,176,.30),transparent 70%),linear-gradient(180deg,#0A0B0E 0%,#121419 100%)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,#0A3A70 0%,#105CB0 30%,#2E8BEF 60%,#F4F5F6 100%);opacity:.9}
.top .hd{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:14px 13px}
.brand{display:flex;align-items:center;gap:18px;min-width:0}
.brand img.tmt{height:42px;width:auto;display:block;flex:none}
.bdiv{flex:none;width:1px;height:40px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.28),transparent)}
.ttl{min-width:0}
.ttl span{display:block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.ttl b{display:block;font-size:clamp(16px,1.45vw,20px);font-weight:700;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:18px;flex:none}
.meta .txt{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;line-height:1.3}
.live{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;white-space:nowrap}
.live i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(46,139,239,.2)}
.meta small{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.marca{display:flex;align-items:center;min-height:40px}
.marca img{max-height:38px;max-width:140px;object-fit:contain}
.marca-vazia{border:1px dashed var(--stone-2);border-radius:8px;padding:7px 11px;font-size:11px;color:var(--ink-3);white-space:nowrap}
.marca-nome{font-size:15px;font-weight:700;white-space:nowrap}
.btn-ghost{cursor:pointer;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn-ghost:hover{background:var(--accent);color:#15181E}
@media (max-width:1000px){.meta .txt{display:none}}

/* ---------- abas ---------- */
.tabbar{position:sticky;top:0;z-index:20;background:rgba(12,13,17,.95);backdrop-filter:saturate(150%) blur(12px);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabbtn{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;background:transparent;color:#C9CED4;border:none;padding:11px 12px 13px;line-height:1.2}
.tabbtn+.tabbtn::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:1px;background:rgba(255,255,255,.08)}
.tabbtn::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .2s}
.tabbtn .ic{flex:none;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);display:grid;place-items:center}
.tabbtn b{display:block;font-size:13.5px;font-weight:700;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbtn span.sub{display:block;font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbtn:hover{background:rgba(255,255,255,.05);color:#fff}
.tabbtn[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,rgba(46,139,239,0) 20%,rgba(46,139,239,.12) 100%)}
.tabbtn[aria-selected="true"]::after{transform:scaleX(1)}
.tabbtn[aria-selected="true"] .ic{background:var(--blue-2);border-color:var(--blue)}
.tabbtn.quiet{flex:1 1 0;min-width:0}
@media (max-width:1100px){.tabbtn span.sub{display:none}.tabbtn .ic{width:28px;height:28px}}
.tabbtn>span:last-child{min-width:0}
@media (max-width:760px){.bdiv,.ttl span{display:none}.ttl b{font-size:14px;white-space:normal}.brand img.tmt{height:28px}.btn-ghost .lbl{display:none}.tabbtn,.tabbtn.quiet{flex:1 1 0;min-width:0;padding:10px 12px 12px;justify-content:center}.tabbtn span.sub,.tabbtn b{display:none}}

/* ---------- blocos comuns ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:12px;margin-bottom:10px}
.eyebrow::before{content:"";flex:none;width:30px;height:3px;background:var(--accent);border-radius:2px}
.lede{color:#D5DAE0;font-size:clamp(14px,1.1vw,16px);border-left:3px solid var(--accent);padding-left:16px;margin-top:16px}
.lede p+p{margin-top:8px}.lede strong{color:#fff}
.band{background:radial-gradient(900px 420px at 85% 10%,rgba(46,139,239,.14),transparent 60%),linear-gradient(180deg,#15181E 0%,#0B0C0F 100%);border-bottom:1px solid rgba(255,255,255,.06)}
.bandin{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-block:26px 28px}
.band .sub{color:var(--ink-2);font-size:14.5px;margin-top:10px;line-height:1.5;max-width:110ch}
.band .sub strong{color:#fff}
.heros{display:flex;gap:16px 0;flex-wrap:wrap}
.heros>div{flex:0 1 auto;padding:4px 26px;border-left:1px solid rgba(255,255,255,.16);min-width:0}
.heros>div:first-child{border-left:none;padding-left:0}
.heros .n{font-size:clamp(21px,1.9vw,27px);font-weight:700;line-height:1;color:#fff;white-space:nowrap}
.heros .t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA1AA;margin-top:8px;white-space:nowrap}
.heros .d{font-size:11.5px;color:var(--ink-3);margin-top:3px;white-space:nowrap}
.body{display:flex;flex-direction:column;gap:18px;padding-top:20px;padding-bottom:48px}
.card{background:var(--card);border:1px solid var(--stone);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:10px}
.chead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px 18px;flex-wrap:wrap}
.chead>div:first-child{flex:1 1 20rem;min-width:0}
.cap{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,30rem),1fr));gap:18px;align-items:stretch}
.g-mapa{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(400px,1fr);gap:18px;align-items:start}
.tablewrap.media{max-height:470px}
@media (max-width:1100px){.g-mapa{grid-template-columns:minmax(0,1fr)}}
.hl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.hl{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.hl{grid-template-columns:minmax(0,1fr)}}
.hl>div{background:var(--card);border:1px solid var(--stone);border-radius:10px;padding:15px 18px 15px 22px;box-shadow:var(--shadow);position:relative;overflow:hidden;min-width:0}
.hl>div::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.hl>div:nth-child(3n+2)::after{background:var(--blue-2)}.hl>div:nth-child(3n)::after{background:var(--accent)}
.hl .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.hl .n{font-size:clamp(21px,1.8vw,26px);font-weight:700;color:#fff;line-height:1.1;margin-top:5px}
.hl .t{font-size:13px;color:var(--ink-2);margin-top:5px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:5px 18px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;overflow:visible;font-family:var(--font)}
.toggle{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toggle>span{color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.toggle button{cursor:pointer;height:34px;padding:0 15px;font-size:13px;font-weight:700;border-radius:8px;border:1px solid var(--stone-2);background:rgba(255,255,255,.06)}
.toggle button[aria-pressed="true"]{background:var(--blue-2);border-color:var(--blue);color:#fff}
.note{font-size:13px;color:var(--ink-2)}.note strong{color:var(--ink)}

/* ---------- filtros ---------- */
.fwrap{padding-top:16px}.fwrap[hidden]{display:none}
.filters{display:grid;grid-template-columns:repeat(4,minmax(9rem,1fr)) auto auto;gap:10px;align-items:end;background:var(--card);border:1px solid var(--stone);border-radius:10px;padding:11px 16px 12px;box-shadow:var(--shadow)}
.filters.mais{grid-template-columns:repeat(4,minmax(9rem,1fr));margin-top:10px}
.filters.mais[hidden]{display:none}
@media (max-width:900px){.filters,.filters.mais{grid-template-columns:repeat(2,minmax(0,1fr))}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.f select{font-size:13px;font-weight:700;color:#fff;background:#1C2028;border:1px solid var(--stone-2);border-radius:8px;padding:6px 9px;min-width:0;width:100%;cursor:pointer}
.f select option{background:#111318}
.f.on select{border-color:var(--blue);background:rgba(46,139,239,.18)}
.btn{cursor:pointer;font-size:13px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid var(--stone-2);border-radius:8px;padding:6px 13px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn[aria-expanded="true"]{border-color:var(--blue)}
.fcount{font-size:12px;color:var(--ink-3);margin-top:7px}

/* ---------- tabelas ---------- */
.tablewrap{overflow:auto;max-width:100%;border-radius:8px}.tablewrap.tall{max-height:64vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
thead th{text-align:left;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--stone-2);background:#181B22;position:sticky;top:0;z-index:2;vertical-align:bottom;line-height:1.25}
thead th button{all:unset;cursor:pointer}
thead th button:focus-visible{outline:2px solid var(--accent)}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:.6rem}th[aria-sort="descending"] button::after{content:" ▼";font-size:.6rem}
th.num,td.num{text-align:right;white-space:nowrap}
tbody td{padding:7px 10px;border-bottom:1px solid var(--stone);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:rgba(255,255,255,.04)}
tr.clic{cursor:pointer}
td.nm{font-weight:700;color:#fff}
tfoot td{position:sticky;bottom:0;z-index:2;background:#181B22;padding:8px 10px;font-weight:700;border-top:1px solid var(--stone-2);white-space:nowrap}
.vbar{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;width:100%}
.vbar i{position:relative;display:block;flex:0 0 64px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}.vbar i b{position:absolute;inset:0 auto 0 0;background:var(--blue);border-radius:3px}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.up{color:var(--st-crit)}.down{color:var(--st-comp)}
.gap{white-space:nowrap;font-weight:700}

/* barras horizontais */
.hbar{display:grid;grid-template-columns:minmax(110px,38%) 1fr;align-items:center;gap:10px;padding:7px 0}
.hbar-rot{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.hbar-faixa{display:flex;align-items:center;gap:8px}
.hbar-faixa i{display:block;height:16px;border-radius:0 4px 4px 0;min-width:2px}
.hbar-faixa b{font-size:12.5px;font-variant-numeric:tabular-nums}
/* status segmentado */
.seg{display:flex;gap:2px;height:28px}
.seg button{border:0;border-radius:4px;cursor:pointer;color:#0b0b0c;font-size:11.5px;font-weight:700;text-align:left;padding:0 8px;overflow:hidden;white-space:nowrap;min-width:3px}
.seg button.off{opacity:.28}

/* ---------- início ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 56px;align-items:center;padding-block:40px 56px;min-height:min(72vh,660px)}
@media (max-width:960px){.cover{grid-template-columns:minmax(0,1fr)}}
.cover-bg{background:radial-gradient(1200px 600px at 80% 20%,rgba(46,139,239,.16),transparent 60%),linear-gradient(180deg,#15181E 0%,#0B0C0F 100%)}
.cover h1{font-size:clamp(26px,2.5vw,36px)}
#cov-heros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:26px}
#cov-heros>div{border:none;padding:0}
#cov-heros .n{font-size:clamp(20px,1.7vw,26px);white-space:normal}
#cov-heros .t{white-space:normal;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink-2)}
@media (max-width:640px){#cov-heros{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ctas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.ctas{grid-template-columns:minmax(0,1fr)}}
.cta{cursor:pointer;text-align:left;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:14px 16px;color:#fff;transition:background .15s,transform .15s;min-width:0}
.cta:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.cta b{display:block;font-size:15px}.cta span{display:block;font-size:12px;color:var(--ink-2);margin-top:3px}
.cta em{display:block;font-style:normal;font-size:20px;font-weight:700;color:#fff;margin-top:10px}
.cta small{display:block;font-size:11.5px;color:var(--ink-2);margin-top:1px}

/* ---------- metodologia ---------- */
.dest{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:980px){.dest{grid-template-columns:minmax(0,1fr)}}
.dcard{background:var(--card);border:1px solid var(--stone);border-radius:14px;padding:18px 22px 18px 26px;box-shadow:var(--shadow);position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px}
.dcard::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--blue)}
.dcard:nth-child(2)::after{background:var(--blue-2)}.dcard:nth-child(3)::after{background:var(--accent)}.dcard:nth-child(4)::after{background:#6D7A88}
.dcard .tag{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.dcard .num{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#15181E;background:var(--accent);letter-spacing:0}
.dcard h3{font-size:17px;line-height:1.3;font-weight:700;color:#fff}
.dcard p{font-size:13.5px;color:var(--ink-2);line-height:1.5}.dcard p strong{color:var(--ink)}
.kvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:2px;padding-top:12px;border-top:1px solid var(--stone-2)}
.kvs .kl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.kvs .kn{font-size:13.5px;color:var(--ink);margin-top:4px;line-height:1.45}
.link{all:unset;cursor:pointer;align-self:flex-start;font-size:12.5px;font-weight:700;color:#fff;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px;margin-top:2px}
.link:hover{border-color:#fff}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr));gap:22px;counter-reset:s}
.steps>li{counter-increment:s;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.steps>li>strong{color:var(--ink);display:block;font-size:15px;margin-bottom:6px}
.steps>li::before{content:counter(s);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:12px;font-weight:700;color:#15181E;background:var(--accent);margin-bottom:10px}
.steps ul{margin:0;padding:0;list-style:none}
.steps ul li{padding:6px 0 6px 14px;border-top:1px solid var(--stone);position:relative}
.steps ul li::before{content:"›";position:absolute;left:0;color:var(--ink);font-weight:700}
.steps ul li strong{color:var(--ink)}
.fluxo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.9fr);gap:0;align-items:stretch}
@media (max-width:900px){.fluxo{grid-template-columns:minmax(0,1fr)}}
.fcol{position:relative;padding:0 26px 0 0}
.fcol:not(:last-child)::after{content:"→";position:absolute;right:6px;top:34px;color:var(--ink-3);font-size:18px}
@media (max-width:900px){.fcol{padding:0 0 22px}.fcol:not(:last-child)::after{content:"↓";right:auto;left:8px;top:auto;bottom:0}}
.fcol h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.fbox{background:rgba(255,255,255,.05);border:1px solid var(--stone-2);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.fbox b{display:block;font-size:13.5px;color:#fff}.fbox span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.fbox.fim{background:var(--blue-3);border-color:var(--blue)}
.method{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:14px}
.method>div{background:var(--card);border:1px solid var(--stone);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);font-size:13px;color:var(--ink-2)}
.method b{display:block;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:5px}
.fechamento{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:22px;align-items:center;border:1px solid var(--stone-2);border-radius:14px;padding:20px 24px;background:radial-gradient(600px 200px at 0% 0%,rgba(46,139,239,.14),transparent 70%),var(--surface)}
@media (max-width:860px){.fechamento{grid-template-columns:minmax(0,1fr)}}
.fechamento h2{font-size:20px;line-height:1.3}
.fechamento p.cap{font-size:13px;margin-top:6px}
.btn-cta{display:inline-flex;margin-top:14px;padding:11px 20px;border-radius:999px;background:var(--accent);color:#15181E;font-weight:700;text-decoration:none;font-size:13.5px}
.btn-cta:hover{background:#fff}

/* ---------- matriz ---------- */
.sim-card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(280px,1fr);gap:24px;align-items:center}

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const n0 = v => Math.round(v).toLocaleString('pt-BR');
const n1 = v => v.toLocaleString('pt-BR', {minimumFractionDigits: 1, maximumFractionDigits: 1});
const n2 = v => v.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const rs = v => (v < 0 ? '−' : '') + 'R$ ' + n2(Math.abs(v));
const rsC = v => { const a = Math.abs(v), s = v < 0 ? '−' : '';
    return a >= 1e6 ? `${s}R$ ${n2(a/1e6)} mi` : a >= 1e4 ? `${s}R$ ${n0(a/1e3)} mil` : `${s}R$ ${n0(a)}`; };
const pc = (v, d = 1) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits: d, maximumFractionDigits: d}) + '%';
const soma = (a, f) => a.reduce((s, x) => s + f(x), 0);
const uniq = a => [...new Set(a)].sort((x, y) => x.localeCompare(y, 'pt-BR'));
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ICON = p => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${p}"/></svg>`;

const STATUS = {
    'Crítico': {v: '--st-crit'}, 'Atenção': {v: '--st-warn'}, 'Neutro': {v: '--st-neut'}, 'Competitiva': {v: '--st-comp'}
};
const statusDe = g => g > 50 ? 'Crítico' : g > 15 ? 'Atenção' : g >= -10 ? 'Neutro' : 'Competitiva';
const chip = (t, v) => `<span class="st" style="color:var(${v})"><i style="background:var(${v})"></i>${t}</span>`;
const stHtml = s => chip(s, STATUS[s].v);
const gapHtml = g => `<span class="gap"><span class="${g > 0 ? 'up' : 'down'}">${g > 0 ? '↑' : '↓'}</span> ${pc(g)}</span>`;
const faixaKm = km => km <= 100 ? 'Até 100 km' : km <= 300 ? '101 a 300 km' : km <= 600 ? '301 a 600 km' : 'Acima de 600 km';
const BIM = i => ['3º BIM/2026','3º BIM/2026','4º BIM/2026','4º BIM/2026','5º BIM/2026','5º BIM/2026'][i];

/* ---------- linhas planas ---------- */
const LINHAS = [];
D.rotas.forEach((r, id) => {
    if (r.rt === 'Extrapolação') r.rt = 'Não referente'; // extrapolação conta como não referente
    r.id = id; r.local = r.o === r.d; r.fx = faixaKm(r.km); r.nome = `${r.o} → ${r.d}`;
    r.m.forEach((x, mi) => {
        if (!x) return;
        const [vol, tc, tp, frota, frotaRef, cc] = x;
        LINHAS.push({r, mi, vol, tc, tp, frota, frotaRef, cc, spend: vol * tc, spendP: vol * tp, gap: (tc / tp - 1) * 100, viag: vol / r.cap});
    });
});

/* ---------- estado ---------- */
const F = {ano:'', bim:'', mes:'', ro:'', uo:'', o:'', rd:'', ud:'', d:'', fx:'', vei:'', prod:'', status:''};
const FILTROS = [
    ['ro','Região de origem', r => r.ro], ['uo','UF origem', r => r.uo], ['o','Cidade origem', r => r.o],
    ['rd','Região destino', r => r.rd], ['ud','UF destino', r => r.ud], ['d','Cidade destino', r => r.d],

];

const mesOk = mi => (!F.bim || BIM(mi) === F.bim) && (!F.mes || D.meses[mi] === F.mes) && (!F.ano || D.meses[mi].endsWith(F.ano));
const rotaOk = r => FILTROS.every(([k,, f]) => !F[k] || f(r) === F[k]);
const semPeriodo = () => LINHAS.filter(l => rotaOk(l.r));
const baseLinhas = () => semPeriodo().filter(l => mesOk(l.mi));
const linhasMes = () => baseLinhas().filter(l => !F.status || statusDe(l.gap) === F.status);
const per = () => F.mes ? F.mes.charAt(0) + F.mes.slice(1, 3).toLowerCase() + '/26' : F.bim ? F.bim.replace('/2026', '').replace('BIM', 'bimestre') : 'mai a out/26';

/* agrega por rota; status vem do período inteiro */
function agrupa(linhas) {
    const m = new Map();
    linhas.forEach(l => {
        const a = m.get(l.r.id) || {r: l.r, vol: 0, spend: 0, spendP: 0, frotaS: 0, frotaRefS: 0, ccS: 0, meses: 0, viag: 0};
        a.vol += l.vol; a.spend += l.spend; a.spendP += l.spendP; a.frotaS += l.frota; a.frotaRefS += l.frotaRef;
        a.ccS += l.cc * l.vol; a.meses++; a.viag += l.viag;
        m.set(l.r.id, a);
    });
    return [...m.values()].map(a => {
        a.tc = a.spend / a.vol; a.tp = a.spendP / a.vol; a.gapV = a.tc - a.tp; a.gap = (a.tc / a.tp - 1) * 100;
        a.status = statusDe(a.gap); a.exc = Math.max(0, a.spend - a.spendP); a.cc = a.ccS / a.vol;
        a.frota = a.frotaS / a.meses; a.frotaRef = a.frotaRefS / a.meses; a.volMes = a.vol / a.meses;
        a.frente = frenteDe(a);
        return a;
    });
}
const linhasRota = () => agrupa(baseLinhas()).filter(a => !F.status || a.status === F.status);

function frenteDe(a) {
    if (a.gap > 50) return 'crise';
    if (a.r.local && a.gap > 15) return 'piso';
    if (a.gap > 0 && ((a.frota >= 2 && a.frota > a.frotaRef * 1.25) || (a.r.fluxo === 'SPOT' && a.volMes >= BREAKEVEN) || (a.r.fluxo === 'CONTRATADO' && a.volMes < 100))) return 'estrutura';
    if (a.gap > 0 && a.cc > a.r.cr * 1.3) return 'operacao';

}

const tip = $('#tip');
function mostraTip(html, ev) {
    tip.innerHTML = html; tip.style.display = 'block';
    const b = tip.getBoundingClientRect();

    if (x + b.width > innerWidth - 8) x = ev.clientX - b.width - 14;
    if (y + b.height > innerHeight - 8) y = ev.clientY - b.height - 14;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const someTip = () => { tip.style.display = 'none'; };
function ligaTips(root) {
    root.querySelectorAll('[data-tip]').forEach(el => {
        const show = e => {
            if (e.type === 'focus') { const b = el.getBoundingClientRect(); e = {clientX: b.left + b.width / 2, clientY: b.top}; }
            mostraTip(el.dataset.tip, e);
        };
        el.addEventListener('mousemove', show); el.addEventListener('focus', show);
        el.addEventListener('mouseleave', someTip); el.addEventListener('blur', someTip);

}

/* ---------- gráficos ---------- */
function escala(min, max, passos = 4) {
    if (min === max) { min = min * .9; max = max * 1.1 || 1; }
    const b = Math.pow(10, Math.floor(Math.log10((max - min) / passos)));
    const p = [1, 2, 2.5, 5, 10].map(k => k * b).find(k => (max - min) / k <= passos) || 10 * b;
    const lo = Math.floor(min / p) * p, hi = Math.ceil(max / p) * p, t = [];
    for (let v = lo; v <= hi + p / 2; v += p) t.push(v);
    return {lo, hi, t};
}
const eixoC = v => Math.abs(v) >= 1e6 ? n1(v / 1e6) + ' mi' : Math.abs(v) >= 1e4 ? n0(v / 1e3) + ' mil' : n0(v);

function grafLinha(el, {x, series, fmt, h = 250, zero = false}) {
    const W = Math.max(el.clientWidth, 260), H = h, m = {t: 24, r: 44, b: 26, l: 58};

    const sc = escala(zero ? 0 : Math.min(...vals) * .94, Math.max(...vals) * 1.03);
    const X = i => m.l + (x.length === 1 ? pw / 2 : i * pw / (x.length - 1));
    const Y = v => m.t + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(series.map(a => a.nome).join(' e '))} por mês">`;
    sc.t.forEach(t => { s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(255,255,255,.09)"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${cor('--ink-3')}">${eixoC(t)}</text>`; });
    x.forEach((l, i) => { s += `<text x="${X(i)}" y="${H - 7}" text-anchor="middle" font-size="11" fill="${cor('--ink-2')}">${l}</text>`; });
    const ultimo = series.map(a => a.v[a.v.length - 1]), maior = ultimo.indexOf(Math.max(...ultimo));
    series.forEach((a, si) => {
        s += `<polyline fill="none" stroke="${a.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${a.v.map((v, i) => `${X(i)},${Y(v)}`).join(' ')}"/>`;

                s += `<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${a.c}" stroke="${cor('--surface')}" stroke-width="2"/>`;
                const dy = si === maior ? -10 : 17;

            }

        const html = `<b>${l}</b><br>` + series.map(a => `<span class="k" style="background:${a.c}"></span>${esc(a.nome)}: <b>${fmt(a.v[i])}</b>`).join('<br>');

    });

        r.addEventListener('mouseleave', () => cross.style.display = 'none'); r.addEventListener('blur', () => cross.style.display = 'none');

/* dispersão com eixo X logarítmico */
function grafMapa(el, bases) {
    const W = Math.max(el.clientWidth, 280), H = 470, m = {t: 18, r: 22, b: 40, l: 56};
    const pw = W - m.l - m.r, ph = H - m.t - m.b;
    const xs = bases.map(b => b.vol), ys = bases.map(b => b.gapV);
    const lx0 = Math.floor(Math.log10(Math.min(...xs))), lx1 = Math.ceil(Math.log10(Math.max(...xs)));
    const sc = escala(Math.min(...ys, 0) - 4, Math.max(...ys, 0) + 4, 6);
    const X = v => m.l + (Math.log10(v) - lx0) / (lx1 - lx0 || 1) * pw;
    const Y = v => m.t + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
    const maxS = Math.max(...bases.map(b => b.spend));
    const Rr = b => 5 + Math.sqrt(b.spend / maxS) * 19;
    let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Volume e gap por base">`;
    sc.t.forEach(t => { const zero = Math.abs(t) < 1e-9;
        s += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="rgba(255,255,255,${zero ? .45 : .08})"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="${cor('--ink-3')}">${zero ? 'R$ 0' : (t > 0 ? '+' : '') + n0(t)}</text>`; });
    for (let e = lx0; e <= lx1; e++) s += `<line x1="${X(10 ** e)}" x2="${X(10 ** e)}" y1="${m.t}" y2="${m.t + ph}" stroke="rgba(255,255,255,.08)"/><text x="${X(10 ** e)}" y="${m.t + ph + 16}" text-anchor="middle" font-size="11" fill="${cor('--ink-3')}">${n0(10 ** e)}</text>`;
    s += `<text x="${m.l + pw / 2}" y="${H - 5}" text-anchor="middle" font-size="11.5" fill="${cor('--ink-2')}">Volume no período (m³, escala log)</text>`;
    s += `<text transform="translate(12 ${m.t + ph / 2}) rotate(-90)" text-anchor="middle" font-size="11.5" fill="${cor('--ink-2')}">Gap médio (R$/m³)</text>`;
    [...bases].sort((a, b) => b.spend - a.spend).forEach(b => {
        const c = cor(b.gapV > 0 ? '--st-crit' : '--st-comp');
        const html = `<b>${esc(b.nome)}</b><br>Volume: <b>${n0(b.vol)} m³</b><br>Gap: <b>${rs(b.gapV)}/m³</b> (${pc(b.gap)})<br>Excedente: <b>${rsC(b.exc)}</b><br>${b.n} rota(s).`;
        s += `<circle class="b" data-o="${esc(b.nome)}" cx="${X(b.vol)}" cy="${Y(b.gapV)}" r="${Rr(b)}" fill="${c}" fill-opacity=".72" stroke="${cor('--surface')}" stroke-width="2" tabindex="0" aria-label="${esc(b.nome)}" data-tip="${esc(html)}"/>`;
    });
    const postos = [];
    [...bases].sort((a, b) => Math.abs(b.gapV * b.vol) - Math.abs(a.gapV * a.vol)).slice(0, 10).forEach(b => {
        const lw = b.nome.length * 7.4, r = Rr(b); let lx = X(b.vol) + r + 4, ly = Y(b.gapV) + 4, an = 'start';
        if (lx + lw > W - m.r) { lx = X(b.vol) - r - 4; an = 'end'; }
        const box = {x: an === 'start' ? lx : lx - lw, y: ly - 11, w: lw, h: 14};
        if (postos.some(p => box.x < p.x + p.w && p.x < box.x + box.w && box.y < p.y + p.h && p.y < box.y + box.h)) return;
        postos.push(box);
        s += `<text x="${lx}" y="${ly}" text-anchor="${an}" font-size="11" font-weight="700" fill="${cor('--ink')}" stroke="${cor('--surface')}" stroke-width="3" paint-order="stroke" style="pointer-events:none">${esc(b.nome)}</text>`;
    });
    el.innerHTML = s + '</svg>';
    ligaTips(el);
}

/* ---------- tabela ---------- */
function tabela(el, chave, cols, linhas, {total, sortPad, limite, onRow, alta = true} = {}) {
    const st = S.sort[chave] || (S.sort[chave] = sortPad);
    const col = cols.find(c => c.k === st.k) || cols[0];
    const ord = [...linhas].sort((a, b) => {
        const x = col.s ? col.s(a) : a[col.k], y = col.s ? col.s(b) : b[col.k];
        const r = typeof x === 'string' ? x.localeCompare(y, 'pt-BR') : x - y;
        return st.d * r;
    });
    const vis = limite ? ord.slice(0, limite) : ord;
    const maxBar = {}; cols.filter(c => c.bar).forEach(c => { maxBar[c.k] = Math.max(...linhas.map(l => l[c.k]), 1); });
    const cls = c => (c.n || c.bar ? 'num ' : '') + (c.cl || '');
    const celula = (c, l) => {
        const h = c.f ? c.f(l) : esc(l[c.k]);
        return c.bar ? `<td class="num"><span class="vbar">${h}<i><b style="width:${l[c.k] / maxBar[c.k] * 100}%"></b></i></span></td>` : `<td class="${cls(c)}">${h}</td>`;
    };
    el.innerHTML = `<div class="tablewrap ${alta ? 'tall' : ''}" tabindex="0" role="region" aria-label="Tabela"><table><thead><tr>${cols.map(c => {
        const on = c.k === st.k;
        return `<th class="${cls(c)}" ${on ? `aria-sort="${st.d > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" data-k="${c.k}">${c.t}</button></th>`;
    }).join('')}</tr></thead><tbody>${vis.map((l, i) => `<tr ${onRow ? `class="clic" tabindex="0" data-i="${i}"` : ''}>${cols.map(c => celula(c, l)).join('')}</tr>`).join('')}</tbody>${total ? `<tfoot><tr>${total.map((t, i) => `<td class="${cls(cols[i] || {})}">${t}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
    el.querySelectorAll('th button').forEach(b => b.addEventListener('click', () => {
        const k = b.dataset.k, cur = S.sort[chave];
        S.sort[chave] = {k, d: cur.k === k ? -cur.d : -1};
        tabela(el, chave, cols, linhas, {total, sortPad, limite, onRow, alta});
        el.querySelector(`th button[data-k="${k}"]`).focus();
    }));
    if (onRow) el.querySelectorAll('tbody tr').forEach(tr => {
        const go = () => onRow(vis[+tr.dataset.i]);
        tr.addEventListener('click', go);
        tr.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
}

    </div>`;
    grafColunas($('#gProd'), {x: porFx.map(x => x.f), fmt: n1, rotulo: 'Produtividade por faixa de distância', series: [{nome: CLI, c: azul, v: porFx.map(x => x.c)}, {nome: 'Referência TMT', c: ref, v: porFx.map(x => x.r)}]});
    grafColunas($('#gFrota'), {x: porMes.map(x => x.mes), fmt: n0, rotulo: 'Frota alocada por mês', series: [{nome: `Frota ${CLI}`, c: azul, v: porMes.map(x => x.c)}, {nome: 'Frota de referência', c: ref, v: porMes.map(x => x.r)}]});
    if (loc.length) grafColunas($('#gCiclo'), {x: ciclo.map(x => x.mes), fmt: v => n1(v) + ' h', h: 400, rotulo: 'Ciclo médio nas rotas locais', series: [{nome: `Ciclo ${CLI}`, c: azul, v: ciclo.map(x => x.c)}, {nome: 'Referência TMT', c: ref, v: ciclo.map(x => x.r)}]});
    $('#btnTabela').addEventListener('click', () => { S.tabela = !S.tabela; render(); $('#btnTabela').focus(); });
    if (!S.tabela) return;
    const top20 = agrupa(l).sort((a, b) => b.vol - a.vol).slice(0, 20).map(a => ({...a, prodC: a.viag / a.frotaS, tkuC: a.tc / a.r.km, tkuP: a.tp / a.r.km}));
    const T20 = totais(top20), sk20 = soma(top20, x => x.vol * x.r.km), viag20 = soma(top20, x => x.viag);
    tabela($('#tFrota'), 'frota', [
        {k:'o', t:'Origem', s: x => x.r.o, cl: 'nm', f: x => `${esc(x.r.o)}/${x.r.uo}`}, {k:'d', t:'Destino', s: x => x.r.d, f: x => `${esc(x.r.d)}/${x.r.ud}`},
        {k:'km', t:'KM I/V', n: 1, s: x => x.r.km, f: x => n0(x.r.km)}, {k:'vei', t:'Veículo', s: x => x.r.vei, f: x => x.r.vei}, {k:'vol', t:'Volume (m³)', bar: 1, f: x => n0(x.vol)},
        {k:'prodC', t:`Produtiv. ${esc(CLI)}`, n: 1, f: x => n2(x.prodC)}, {k:'ref', t:'Produtiv. mercado', n: 1, s: x => x.r.ref, f: x => n1(x.r.ref)},
        {k:'frota', t:`Frota ${esc(CLI)}`, n: 1, f: x => n1(x.frota)}, {k:'frotaRef', t:'Veículos mercado', n: 1, f: x => n1(x.frotaRef)},
        {k:'ef', t:'Eficiência', s: x => x.prodC / x.r.ref, f: x => chip(...eficiencia(x.prodC / x.r.ref))},
        {k:'tc', t:`Tarifa ${esc(CLI)}`, n: 1, f: x => rs(x.tc)}, {k:'tp', t:'Tarifa Players ABC', n: 1, f: x => rs(x.tp)},
        {k:'tkuC', t:`R$/TKU ${esc(CLI)}`, n: 1, f: x => rs(x.tkuC)}, {k:'tkuP', t:'R$/TKU Players', n: 1, f: x => rs(x.tkuP)},
        {k:'gap', t:'Gap', n: 1, f: x => gapHtml(x.gap)}, {k:'status', t:'Status', f: x => stHtml(x.status)},
        {k:'ac', t:'Ação piso', s: x => x.r.local ? x.gap : -999, f: x => x.r.local ? chip(...acaoPiso(x.gap)) : '<span style="color:var(--ink-3)">não local</span>'}
    ], top20, {sortPad: {k:'vol', d:-1}, alta: false, onRow: x => abreRota(x.r.id),
        total: ['Total das 20 rotas', '', n0(kmMed(top20)), '', n0(T20.vol), n2(viag20 / soma(top20, x => x.frotaS)), n1(viag20 / soma(top20, x => x.viag / x.r.ref)), n1(soma(top20, x => x.frota)), n1(soma(top20, x => x.frotaRef)), '', rs(T20.tc), rs(T20.tp), rs(T20.spend / sk20), rs(T20.spendP / sk20), pc(T20.gap), '', '']});
}

function pgMapa(pg) {
    const a = linhasRota();
    if (!a.length) return vazio(pg, 'Onde negociar');
    const m = new Map();
    a.forEach(x => { const b = m.get(x.r.o) || {nome: x.r.o, uf: x.r.uo, vol: 0, spend: 0, spendP: 0, exc: 0, n: 0};
        b.vol += x.vol; b.spend += x.spend; b.spendP += x.spendP; b.exc += x.exc; b.n++; m.set(x.r.o, b); });
    const bases = [...m.values()].map(b => ({...b, gapV: (b.spend - b.spendP) / b.vol, gap: (b.spend / b.spendP - 1) * 100}));
    const pos = bases.filter(b => b.gapV > 0), top = [...bases].sort((x, y) => y.exc - x.exc)[0];
    pg.innerHTML = band('Onde negociar · mapa de bases · ' + per(), `${n0(pos.length)} de ${n0(bases.length)} bases pagam acima da referência`,
        `A maior concentração de excedente está em <strong>${esc(top.nome)}/${top.uf}</strong>, com <strong>${rsC(top.exc)}</strong> no período.`,
        [[n0(bases.length), 'Bases'], [n0(pos.length), 'Acima da referência'], [rsC(soma(bases, b => b.exc)), 'Excedente total']]) + `<div class="wrap body"><div class="g-mapa">
        ${card('Volume × gap por base', 'Tamanho da bolha = spend. Acima da linha, a base paga mais que a referência.', legenda([['Acima da referência', cor('--st-crit')], ['Abaixo da referência', cor('--st-comp')]]) + '<div class="chart" id="gMapa"></div>')}
        ${card('As 20 bases com maior excedente', 'Excedente = soma das rotas da base acima da referência. Uma base pode ter gap médio negativo e ainda ter rotas a corrigir.', '<div id="tMapa"></div>')}
    </div></div>`;
    grafMapa($('#gMapa'), bases);
    tabela($('#tMapa'), 'mapa', [
        {k:'nome', t:'Base', cl: 'nm'}, {k:'vol', t:'Volume (m³)', n: 1, f: x => n0(x.vol)}, {k:'gap', t:'Gap', n: 1, f: x => gapHtml(x.gap)}, {k:'exc', t:'Excedente', n: 1, f: x => rsC(x.exc)}
    ], [...bases].sort((x, y) => y.exc - x.exc).slice(0, 20), {sortPad: {k:'exc', d:-1}, alta: false});
    $('#tMapa .tablewrap').classList.add('media');
}

/* ---------- gaveta da rota ---------- */
let voltaFoco = null;
function abreRota(id) {
    const r = D.rotas[id], l = LINHAS.filter(x => x.r.id === id).sort((a, b) => a.mi - b.mi), sel = l.filter(x => mesOk(x.mi));
    const a = agrupa(sel.length ? sel : l)[0], g = $('#gaveta');
    voltaFoco = document.activeElement;
    g.innerHTML = `
    <div class="gav-top"><div><h2 id="gavTitulo">${esc(r.nome)}</h2><div class="gav-sub">${r.uo} → ${r.ud} · ${n0(r.km)} km I/V · ${r.vei} · ${r.fluxo === 'SPOT' ? 'Spot' : 'Contratado'}</div></div>
        <button class="gav-fechar" type="button" aria-label="Fechar">×</button></div>
    <div class="gav-kpis">
        <div>Tarifa ${esc(CLI)}<b>${rs(a.tc)}</b></div><div>Tarifa Players ABC<b>${rs(a.tp)}</b></div>
        <div>Gap<b>${pc(a.gap)}</b></div><div>Excedente no período<b>${rsC(a.exc)}</b></div>
        <div>Volume<b>${n0(a.vol)} m³</b></div><div>Status<b>${stHtml(a.status)}</b></div>
    </div>
    <h2 style="font-size:13.5px">Tarifa por mês (R$/m³)</h2>${legenda([[CLI, cor('--serie-cliente')], ['Players ABC', cor('--serie-ref')]])}<div class="chart" id="gGav"></div>
    <div class="gav-rec"><b>Ação sugerida: ${FRENTES[a.frente].t}</b>${FRENTES[a.frente].rec}</div>`;
    $('#veu').classList.add('aberta'); g.classList.add('aberta');
    grafLinha($('#gGav'), {x: l.map(x => D.meses[x.mi].slice(0, 3)), fmt: rs, h: 200, series: [{nome: CLI, c: cor('--serie-cliente'), v: l.map(x => x.tc)}, {nome: 'Players ABC', c: cor('--serie-ref'), v: l.map(x => x.tp)}]});
    g.querySelector('.gav-fechar').addEventListener('click', fechaRota);
    g.querySelector('.gav-fechar').focus();
}
function fechaRota() {
    const g = $('#gaveta');
    if (!g.classList.contains('aberta')) return;
    g.classList.remove('aberta'); $('#veu').classList.remove('aberta'); someTip();
    if (voltaFoco && document.contains(voltaFoco)) voltaFoco.focus();
}
$('#veu').addEventListener('click', fechaRota);

/* ---------- filtros e navegação ---------- */
function limpar() { Object.keys(F).forEach(k => F[k] = ''); render(); }

function desenhaAbas() {
    $('#tabs').innerHTML = Object.entries(PAGINAS).filter(([, p]) => !p.oculta).map(([id, p]) => `<button class="tabbtn ${p.q ? 'quiet' : ''}" role="tab" type="button" data-p="${id}" aria-selected="false" title="${p.t}"><span class="ic">${ICON(IC[p.i || id])}</span><span><b>${p.t}</b><span class="sub">${p.s}</span></span></button>`).join('');
    $('#tabs').querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => navega(b.dataset.p)));
}
function navega(p) {
    S.pag = p;
    if (location.hash.slice(1) !== p) history.replaceState(null, '', '#' + p);
    render(); scrollTo({top: 0});
    const ativa = $(`#tabs [data-p="${p}"]`); if (ativa) ativa.scrollIntoView({block: 'nearest', inline: 'nearest'});
}
function render() {
    const p = PAGINAS[S.pag];
    document.title = `${p.t} | Benchmarking de Fretes Outbound | TMT`;
    $('#tabs').querySelectorAll('[data-p]').forEach(b => b.setAttribute('aria-selected', b.dataset.p === S.pag));
    $('#metaPeriodo').textContent = `Exemplo · ${per()}`;
    document.body.classList.toggle('na-capa', S.pag === 'capa');
    p.r($('#pagina'));
}

/* ---------- início ---------- */
(function marca() {
    const m = $('#marcaCliente');
    if (LOGO) { const i = new Image(); i.alt = CLI; i.src = LOGO; m.appendChild(i); }
    else if (CLI !== 'Cliente') { const s = document.createElement('span'); s.className = 'marca-nome'; s.textContent = CLI; m.appendChild(s); }
    else m.innerHTML = '<span class="marca-vazia">Sua marca aqui</span>';
})();
$('#present').addEventListener('click', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.());
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return fechaRota();
    const g = $('#gaveta');
    if (g.classList.contains('aberta')) { if (e.key === 'Tab') { e.preventDefault(); g.querySelector('.gav-fechar').focus(); } return; }
    if (e.target.matches?.('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
    const ids = Object.keys(PAGINAS).filter(k => !PAGINAS[k].oculta);
    if (S.pag === 'capa' && (e.key === 'Enter' || e.key === 'ArrowRight') && !e.target.matches?.('button')) return navega('inicio');
    if (/^[1-9]$/.test(e.key) && ids[+e.key - 1]) navega(ids[+e.key - 1]);
    if (e.key === 'f' || e.key === 'F') $('#present').click();
});
desenhaAbas();
const inicial = location.hash.slice(1);
navega(PAGINAS[inicial] ? inicial : Object.keys(PAGINAS)[0]);
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (PAGINAS[h] && h !== S.pag) navega(h); });
let rz, lw = innerWidth; addEventListener('resize', () => { if (innerWidth === lw) return; lw = innerWidth; clearTimeout(rz); rz = setTimeout(render, 150); });
</script>
